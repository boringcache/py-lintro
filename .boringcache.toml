workspace = "boringcache/py-lintro"

[entries.nuitka]
tag = "validation-series"
path = ".nuitka-cache"

[profiles.nuitka]
entries = ["nuitka"]

[adapters.docker]
tag = "docker-tools"
command = ["docker", "buildx", "bake", "--file", ".github/boringcache-tools.hcl", "--metadata-file", "/tmp/docker-validation-metadata.json"]
mount-cache = true
tool-cache = ["sccache:rust-docker-tools"]
fail-on-cache-error = true
