workspace = "boringcache/py-lintro"

[entries.nuitka]
tag = "validation-series"
path = ".nuitka-cache"

[profiles.nuitka]
entries = ["nuitka"]

[adapters.docker]
tag = "docker-tools"
command = ["docker", "buildx", "build", "--file", "docker/tools.Dockerfile", "--platform", "linux/amd64", "--load", "--tag", "lintro-tools:validation", "--metadata-file", "/tmp/docker-validation-metadata.json", "."]
mount-cache = true
tool-cache = ["sccache:rust-docker-tools"]
fail-on-cache-error = true
